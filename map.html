<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แผนที่วิทยาเขต - ค้นหาร้านค้าและคาเฟ่</title>
    
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Leaflet CSS (สำหรับแสดงผลแผนที่) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- ไฟล์ CSS หลักของคุณ -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

   <header class="navbar">
        <div class="logo">TU Aroi</div>
        <nav class="nav-links">
            <a href="search.html">ค้นพบ</a>
            <a href="profile.html">บันทึกไว้</a>
            <a href="events.html" class="active">กิจกรรม</a>
            <a href="map.html">แผนที่วิทยาเขต</a>
        </nav>
        <div class="header-right">
            <button id="darkModeToggle" class="theme-toggle-btn" title="สลับโหมดสว่าง/มืด">
                <i class="fa-solid fa-moon"></i>
            </button>
            <a href="profile.html"><i class="fa-regular fa-user icon-btn"></i></a>
        </div>
    </header>
    <!-- Content Container สำหรับแผนที่ -->
    <div class="container" style="flex-direction: column;">
        <div class="content-header">
            <div>
                <h2>แผนที่ร้านค้าภายในวิทยาเขต</h2>
                <p class="sub-text" style="margin-bottom: 0;">ค้นหาพิกัดร้านอาหาร คาเฟ่ และพื้นที่อ่านหนังสือ หรือเพิ่มร้านค้าใหม่บนแผนที่ได้ทันที</p>
            </div>
        </div>

        <!-- Map Component Wrapper -->
        <div class="map-wrapper">
            <!-- แบนเนอร์แจ้งเตือนเมื่ออยู่ในโหมดปักหมุด (ควบคุมด้วย JavaScript) -->
            <div class="pin-mode-banner">
                <i class="fa-solid fa-location-dot"></i> กรุณาคลิกบนแผนที่เพื่อเลือกตำแหน่งร้านค้าใหม่
            </div>

            <!-- ส่วนแสดงแผนที่ Leaflet -->
            <div id="map"></div>

            <!-- กลุ่มปุ่มควบคุมแผนที่มุมขวาล่าง (สร้างอัตโนมัติหรือรองรับผ่าน CSS) -->
            <div class="map-controls-group">
                <button class="map-control-btn add-mode-btn">
                    <i class="fa-solid fa-plus"></i> เพิ่มร้านค้าบนแผนที่
                </button>
                <button class="map-control-btn">
                    <i class="fa-solid fa-crosshairs"></i> ตำแหน่งของฉัน
                </button>
            </div>
        </div>
    </div>

    <!-- Footer ง่ายๆ -->
    <footer class="footer-simple">
        &copy; 2026 TU Aroi. All rights reserved.
    </footer>

    <!-- Supabase CDN (ถ้าใช้งานร่วมกับระบบฐานข้อมูล) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Leaflet JS (สำหรับประมวลผลแผนที่) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- ไฟล์ JavaScript หลักของคุณ -->
    <script src="script.js"></script>
</body>
</html>
