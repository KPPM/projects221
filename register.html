<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียน - TU Aroi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="center-body">
    <div class="login-card" style="width: 420px; padding: 35px 40px;">
        <div class="icon-circle">✨</div>
        <h2>สมัครสมาชิก TU Aroi</h2>
        <p class="sub-text">บันทึกร้านโปรด ปักหมุดพิกัด และรีวิวความอร่อย</p>

        <form id="registerForm">
            <div class="form-group">
                <label>ชื่อ - นามสกุล</label>
                <input type="text" placeholder="สมชาย ใจดี" required>
            </div>
            <div class="form-group">
                <label>รหัสนักศึกษา (10 หลัก)</label>
                <input type="text" placeholder="66xxxxxxxx" pattern="[0-9]{10}" required>
            </div>
            <div class="form-group">
                <label>อีเมลมหาวิทยาลัย (@tu.ac.th)</label>
                <input type="email" placeholder="student@tu.ac.th" required>
            </div>
            <div class="form-group">
                <label>รหัสผ่าน</label>
                <input type="password" placeholder="อย่างน้อย 8 ตัวอักษร" minlength="8" required>
            </div>
            <button type="submit" class="btn-primary-red" style="width: 100%; margin-top: 10px;">ยืนยันสมัครสมาชิก</button>
        </form>

        <p style="font-size: 13px; margin-top: 20px; color: #666;">
            มีบัญชีผู้ใช้อยู่แล้ว? <a href="login.html" style="color: #a80018; font-weight: bold;">เข้าสู่ระบบ</a>
        </p>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('ลงทะเบียนสำเร็จ! ระบบกำลังพาคุณไปหน้าเข้าสู่ระบบ');
            window.location.href = 'login.html';
        });
    </script>
    <script src="script.js"></script>
</body>
</html>
