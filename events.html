<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กิจกรรม & โปรโมชัน - TU Aroi</title>
    
    <!-- Link CSS -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body id="events-page">
    <header class="navbar">
        <div class="logo">TU Aroi</div>
        <nav class="nav-links">
            <a href="search.html">ค้นพบ</a>
            <a href="profile.html">บันทึกไว้</a>
            <a href="events.html" class="active">กิจกรรม</a>
            <a href="map.html">แผนที่วิทยาเขต</a>
            <a href="random.html" class="nav-random">สุ่มดวง</a>
        </nav>
        <div class="header-right">
            <button id="darkModeToggle" class="theme-toggle-btn" title="สลับโหมดสว่าง/มืด">
                <i class="fa-solid fa-moon"></i>
            </button>
            <a href="profile.html"><i class="fa-regular fa-user icon-btn"></i></a>
            <a href="login.html" class="btn-primary-red" style="padding: 6px 14px; font-size: 13px;">เข้าสู่ระบบ</a>
        </div>
    </header>

    <main class="container" style="flex-direction: column; padding: 30px 20px;">
        <!-- Header Section -->
        <div class="events-header">
            <div>
                <h2 class="events-title">🎉 งานและกิจกรรมภายในมหาวิทยาลัย</h2>
                <p class="events-subtitle">รวบรวมกิจกรรม ตลาดนัด งานคอนเสิร์ต และส่วนลดพิเศษสำหรับชาวธรรมศาสตร์</p>
            </div>
            <button id="add-activity-btn" class="btn-primary-red" type="button" hidden>
                <i class="fa-solid fa-plus"></i> เพิ่มกิจกรรม
            </button>
        </div>

        <!-- Filter Tags -->
        <div class="event-tags-filter">
            <button class="tag-pill active" data-category="all">ทั้งหมด</button>
            <button class="tag-pill" data-category="ongoing">🔥 กำลังจัดอยู่</button>
            <button class="tag-pill" data-category="food">🍔 อาหาร & ตลาดนัด</button>
            <button class="tag-pill" data-category="sports">⚽ กีฬา & กิจกรรม</button>
            <button class="tag-pill" data-category="promo">🏷️ โปรโมชันส่วนลด</button>
            <button class="tag-pill" data-category="concert">🎵 คอนเสิร์ต & ดนตรี</button>
        </div>

        <div class="event-distance-filter" aria-label="กรองกิจกรรมตามระยะทาง">
            <label for="event-distance-range"><i class="fa-solid fa-location-crosshairs"></i> ระยะทางจากตำแหน่งของคุณ</label>
            <select id="event-distance-range">
                <option value="all">ทุกระยะทาง</option>
                <option value="1">ไม่เกิน 1 กม.</option>
                <option value="3">ไม่เกิน 3 กม.</option>
                <option value="5">ไม่เกิน 5 กม.</option>
            </select>
            <button id="event-use-location" type="button" class="map-control-btn">ใช้ตำแหน่งของฉัน</button>
            <span id="event-location-status" class="event-location-status" aria-live="polite"></span>
        </div>

        <!-- Events Grid -->
        <div class="events-grid"><p class="data-state">กำลังโหลดกิจกรรม...</p></div>
    </main>

    <dialog id="add-activity-dialog" class="activity-dialog">
        <form id="add-activity-form" method="dialog">
            <div class="activity-dialog-header">
                <h3>เพิ่มกิจกรรมใหม่</h3>
                <button id="close-activity-dialog" type="button" class="activity-dialog-close" aria-label="ปิด">&times;</button>
            </div>
            <label>ชื่อกิจกรรม<input name="title" required maxlength="100"></label>
            <label>รายละเอียด<textarea name="description" required maxlength="500"></textarea></label>
            <label>สถานที่<input name="location" required maxlength="150"></label>
            <div class="activity-form-grid">
                <label>หมวดหมู่
                    <select name="category"><option value="food">อาหาร & ตลาดนัด</option><option value="sports">กีฬา & กิจกรรม</option><option value="promo">โปรโมชันส่วนลด</option><option value="concert">คอนเสิร์ต & ดนตรี</option></select>
                </label>
                <label>วัน / เวลาเริ่มต้น<input name="dateTime" type="datetime-local" required></label>
                <label>วัน / เวลาสิ้นสุด<input name="endDateTime" type="datetime-local" required></label>
            </div>
            <button class="btn-primary-red" type="submit">บันทึกกิจกรรม</button>
        </form>
    </dialog>

    <footer class="footer-simple">
        © 2026 TU Aroi . Built for the academic community.
    </footer>

    <!-- Scripts -->
    <script src="script.js"></script>
</body>
</html>
