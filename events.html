<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กิจกรรมและโปรโมชั่น - TU Aroi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">TU Aroi</div>
        <nav class="nav-links">
            <a href="search.html">ค้นพบ</a>
            <a href="profile.html">บันทึกไว้</a>
            <a href="events.html" class="active">กิจกรรม</a>
            <a href="map.html">แผนที่วิทยาเขต</a>
        </nav>
        <div class="header-right">
            <a href="profile.html"><i class="fa-regular fa-user icon-btn"></i></a>
            <a href="login.html" class="btn-primary-red" style="padding: 6px 14px; font-size: 13px;">เข้าสู่ระบบ</a>
        </div>
    </header>

    <div class="container">
        <aside class="sidebar">
            <h3>หมวดหมู่กิจกรรม</h3>
            <div class="category-list" style="margin-top: 15px;">
                <button class="cat-btn active"><i class="fa-solid fa-calendar"></i> ทั้งหมด</button>
                <button class="cat-btn"><i class="fa-solid fa-utensils"></i> โปรโมชั่นร้านอาหาร</button>
                <button class="cat-btn"><i class="fa-solid fa-music"></i> บันเทิง/เทศกาลอาหาร</button>
            </div>
        </aside>

        <main class="content">
            <h2>กิจกรรมและส่วนลดร้านอาหารรอบ มธ.</h2>
            <div class="card-grid" style="margin-top: 20px;">
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1475721027785-f74eccf877e2?auto=format&fit=crop&q=80&w=500" alt="Event" style="width:100%; height:160px; object-fit:cover;">
                    <div class="card-info">
                        <h3>เทศกาลตลาดนัดอินเตอร์ มธ.</h3>
                        <p class="desc">📅 25 ต.ค. 2026 | 📍 ลานกิจกรรมเชียงราก</p>
                        <button class="btn-primary-red" style="width:100%;">ดูรายละเอียดร้านค้า</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
